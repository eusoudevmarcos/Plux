services:
  - type: web
    name: pluxsales-api
    runtime: node
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm render:build
    preDeployCommand: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm db:deploy
    startCommand: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm render:start
    initialDeployHook: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm db:seed
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: pluxsales-postgres
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: AURA_ADMIN_EMAILS
        sync: false

databases:
  - name: pluxsales-postgres
    databaseName: pluxsales
    user: pluxsales
