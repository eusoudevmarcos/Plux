services:
  postgres:
    image: postgres:16-alpine
    container_name: pluxsales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pluxsales
      POSTGRES_PASSWORD: pluxsales
      POSTGRES_DB: pluxsales
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

